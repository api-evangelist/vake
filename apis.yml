aid: vake
name: Vake
description: >-
  VAKE is a Norwegian maritime domain awareness company that detects, identifies,
  and tracks "dark vessels" from space. The VAKE platform fuses satellite imagery,
  AIS signals, and machine learning to reveal hidden vessel activity at sea for
  governments and industry. Its three products are Pathfinder, which reconstructs a
  vessel's past, present, and predicted movements and searches satellite imagery for
  vessels that go AIS-dark; Overwatch, which monitors an Area of Interest around ports,
  critical infrastructure, and economic zones to surface unreported activity such as
  illegal fishing, transshipments, and spoofing; and Clearview, a machine-learning
  service that identifies dark-vessel observations in multispectral satellite imagery
  against a global vessel-signature database spanning 2016 to today. The platform is
  delivered as a web application (studio.vake.ai) backed by a private API (api.nemme.io);
  onboarding is sales-led rather than self-serve.
